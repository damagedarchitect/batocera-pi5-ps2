<?xml version="1.0"?>
<!-- Crater PS2 kit: PlayStation 2 on Raspberry Pi 5 / Batocera 43 via ARMSX2.
     The command goes through emulatorlauncher-armsx2, a thin wrapper around Batocera's own
     configgen that registers the extra "armsx2" generator. Delete this file to remove the system. -->
<systemList>
  <system>
        <fullname>PlayStation 2</fullname>
        <name>ps2</name>
        <manufacturer>Sony</manufacturer>
        <release>2000</release>
        <hardware>console</hardware>
        <path>/userdata/roms/ps2</path>
        <extension>.iso .mdf .nrg .bin .img .dump .gz .cso .chd .zso .elf .squashfs</extension>
        <command>/userdata/system/armsx2/emulatorlauncher-armsx2 %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%</command>
        <platform>ps2</platform>
        <theme>ps2</theme>
        <emulators>
            <emulator name="armsx2">
                <cores>
                    <core default="true">armsx2</core>
                </cores>
            </emulator>
            <emulator name="libretro">
                <cores>
                    <core>armsx2</core>
                </cores>
            </emulator>
        </emulators>
  </system>
</systemList>
