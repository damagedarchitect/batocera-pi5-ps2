<?xml version="1.0" encoding="UTF-8" ?>
<!-- Crater PS2 kit: ARMSX2 options for EmulationStation (ported from batocera.linux master armsx2.emulator.yml) -->
<features>
  <emulator name="armsx2" features="cheevos">
    <sharedFeature value="powermode" />
    <sharedFeature value="tdp" />
    <sharedFeature value="videomode" />
    <sharedFeature value="bezel" />
    <sharedFeature value="bezel_stretch" />
    <sharedFeature value="hud" />
    <sharedFeature value="hud_corner" />
    <sharedFeature value="bezel.tattoo" />
    <sharedFeature value="bezel.tattoo_corner" />
    <sharedFeature value="bezel.tattoo_file" />
    <sharedFeature value="bezel.resize_tattoo" />
    <sharedFeature value="use_guns" />
    <sharedFeature value="use_wheels" />
    <sharedFeature value="wheel_rotation" />
    <sharedFeature value="wheel_deadzone" />
    <sharedFeature value="wheel_midzone" />
    <feature name="SHADER SET" submenu="RENDERING" value="armsx2_shaderset" description="">
      <choice name="scanlines" value="1" />
      <choice name="diagonal filter" value="2" />
      <choice name="triangular filter" value="3" />
      <choice name="wave filter" value="4" />
      <choice name="lottes crt" value="5" />
      <choice name="4xrgss" value="6" />
      <choice name="nxagss" value="7" />
    </feature>
    <feature name="OSD MESSAGES" submenu="DISPLAY" value="armsx2_osd_messages" description="Display on screen information like savestate, config warning, etc.">
      <choice name="Enabled (Default)" value="true" />
      <choice name="Disabled" value="false" />
    </feature>
    <feature name="OSD MESSAGES POSITION" submenu="DISPLAY" value="armsx2_osd_messages_position" description="Choose the on-screen position for system messages.">
      <choice name="Top Left" value="1" />
      <choice name="Top Center (Default)" value="2" />
      <choice name="Top Right" value="3" />
      <choice name="Center Left" value="4" />
      <choice name="Center" value="5" />
      <choice name="Center Right" value="6" />
      <choice name="Bottom Left" value="7" />
      <choice name="Bottom Center" value="8" />
      <choice name="Bottom Right" value="9" />
    </feature>
    <feature name="OSD PERFORMANCE POSITION" submenu="DISPLAY" value="armsx2_osd_performance_position" description="Choose the on-screen position for performance metrics (FPS, CPU usage, etc.).">
      <choice name="None (Default)" value="0" />
      <choice name="Top Left" value="1" />
      <choice name="Top Center" value="2" />
      <choice name="Top Right" value="3" />
      <choice name="Center Left" value="4" />
      <choice name="Center" value="5" />
      <choice name="Center Right" value="6" />
      <choice name="Bottom Left" value="7" />
      <choice name="Bottom Center" value="8" />
      <choice name="Bottom Right" value="9" />
    </feature>
    <feature name="GAME ASPECT RATIO" submenu="DISPLAY" value="armsx2_ratio" description="Force the game to render in this aspect ratio. Not all systems support all ratios.">
      <choice name="Fit to Window / Fullscreen" value="Stretch" />
      <choice name="Auto Standard (4:3 interlaced / 3:2 progressive)" value="Auto 4:3/3:2" />
      <choice name="Standard (4:3)" value="243" />
      <choice name="Widescreen (16:9)" value="969" />
      <choice name="10:7 (1.43:1 - custom)" value="607" />
    </feature>
    <feature name="FMV ASPECT RATIO" submenu="DISPLAY" value="armsx2_fmv_ratio" description="Adjusts Full Motion Video movies aspect ratio.">
      <choice name="Off (Default)" value="Off" />
      <choice name="Auto Standard (4:3 interlaced / 3:2 progressive)" value="Auto 4:3/3:2" />
      <choice name="Standard (4:3)" value="243" />
      <choice name="Widescreen (16:9)" value="969" />
      <choice name="10:7 (1.43:1 - custom)" value="607" />
    </feature>
    <feature name="CROP OVERSCAN" submenu="DISPLAY" value="armsx2_crop_overscan" description="Crops a small number of pixels from the screen edges to hide visual artifacts." preset="switchauto">
    </feature>
    <feature name="DEINTERLACING" submenu="DISPLAY" value="armsx2_deinterlacing" description="FMV movie deinterlacing.">
      <choice name="None" value="1" />
      <choice name="Weave (Top Field First)" value="2" />
      <choice name="Weave (Bottom Field First)" value="3" />
      <choice name="Bob (Top Field First)" value="4" />
      <choice name="Bob (Bottom Field First)" value="5" />
      <choice name="Blend (Top Field First)" value="6" />
      <choice name="Blend (Bottom Field First)" value="7" />
      <choice name="Adaptive (Top Field First)" value="8" />
      <choice name="Adaptive (Bottom Field First)" value="9" />
    </feature>
    <feature name="BILINEAR FILTERING" submenu="DISPLAY" value="armsx2_bilinear_filtering" description="Smooths the overall picture as it is displayed on the screen. Corrects positioning between pixels.">
      <choice name="None" value="0" />
      <choice name="Bilinear (Smooth)" value="1" />
      <choice name="Bilinear (Sharp)" value="2" />
    </feature>
    <feature name="ENABLE WIDESCREEN PATCHES" submenu="DISPLAY" value="armsx2_EnableWideScreenPatches" description="Enhancement. Only works with a 16/9 ratio and bezels disabled.">
      <choice name="Disabled" value="false" />
      <choice name="Enabled" value="true" />
    </feature>
    <feature name="ANTI-BLUR" submenu="DISPLAY" value="armsx2_blur" description="Enable to improve bluriness.">
      <choice name="Disabled" value="false" />
      <choice name="Enabled" value="true" />
    </feature>
    <feature name="VSYNC" submenu="DISPLAY" value="armsx2_vsync" description="Fix screen tearing. CPU heavy.">
      <choice name="Disabled" value="false" />
      <choice name="Enabled" value="true" />
    </feature>
    <feature name="INTERLACING PATCHES" submenu="DISPLAY" value="armsx2_interlacing_patches" description="Enable No-interlacing Patches.">
      <choice name="Disabled" value="false" />
      <choice name="Enabled" value="true" />
    </feature>
    <feature name="INTEGER SCALING" submenu="DISPLAY" value="armsx2_scaling" description="Can sharpen images in lower resolutions.">
      <choice name="Disabled" value="false" />
      <choice name="Enabled" value="true" />
    </feature>
    <feature name="GRAPHICS API" submenu="RENDERING" value="armsx2_gfxbackend" description="Pi 5 GPU (V3D) only supports Vulkan for PS2 hardware rendering. Software is a slow fallback.">
      <choice name="Vulkan (Default)" value="14" />
      <choice name="Software (CPU)" value="13" />
    </feature>
    <feature name="RENDERING RESOLUTION" submenu="RENDERING" value="armsx2_resolution" description="Enhancement. Increase the rendering resolution. Makes 3D objects clearer.">
      <choice name="Native (PS2)(Default)" value="1" />
      <choice name="1.25x Native" value="1.25" />
      <choice name="1.5x Native" value="1.5" />
      <choice name="1.75x Native" value="1.75" />
      <choice name="2x Native (~720p)" value="2" />
      <choice name="2.25x Native" value="2.25" />
      <choice name="2.5x Native" value="2.5" />
      <choice name="2.75x Native" value="2.75" />
      <choice name="3x Native (~1080p)" value="3" />
      <choice name="3.5x Native" value="3.5" />
      <choice name="4x Native (~1440p/2K)" value="4" />
      <choice name="5x Native (~1620p)" value="5" />
      <choice name="6x Native (~2160p/4K)" value="6" />
      <choice name="7x Native (~2520p)" value="7" />
      <choice name="8x Native (~2880p/5K)" value="8" />
    </feature>
    <feature name="MIPMAPPING" submenu="RENDERING" value="armsx2_mipmapping" description="Choose mipmapping type.">
      <choice name="Off" value="0" />
      <choice name="On (Default)" value="1" />
    </feature>
    <feature name="TEXTURE FILTERING" submenu="RENDERING" value="armsx2_texture_filtering" description="Control the texture filtering of the emulation.">
      <choice name="Nearest" value="0" />
      <choice name="Bilinear (Forced)" value="1" />
      <choice name="Bilinear (PS2)" value="2" />
      <choice name="Bilinear (Forced excluding sprite)" value="3" />
    </feature>
    <feature name="TRILINEAR FILTERING" submenu="RENDERING" value="armsx2_trilinear_filtering" description="Control the texture's trilinear filtering of the emulation.">
      <choice name="Off (None)" value="0" />
      <choice name="Trilinear (PS2)" value="1" />
      <choice name="Trilinear (Forced)" value="2" />
    </feature>
    <feature name="ANISOTROPIC FILTERING" submenu="RENDERING" value="armsx2_anisotropic_filtering" description="Improves clarity of distant textures.">
      <choice name="Off" value="0" />
      <choice name="2x" value="2" />
      <choice name="4x" value="4" />
      <choice name="8x" value="8" />
      <choice name="16x" value="16" />
    </feature>
    <feature name="DITHERING" submenu="RENDERING" value="armsx2_dithering" description="Reduces banding between colors and improves the preceived color depth.">
      <choice name="Off" value="0" />
      <choice name="Scaled" value="1" />
      <choice name="Unscaled (Default)" value="2" />
      <choice name="Force 32bit" value="3" />
    </feature>
    <feature name="BLENDING ACCURACY" submenu="RENDERING" value="armsx2_blending" description="The higher the setting, the more blending is emulated in the shader accurately, and the higher the speed penalty will be.">
      <choice name="Minimum" value="0" />
      <choice name="Basic (Recommended)" value="1" />
      <choice name="Medium" value="2" />
      <choice name="High" value="3" />
      <choice name="Full (Slow)" value="4" />
      <choice name="Maximum (Very Slow)" value="5" />
    </feature>
    <feature name="TEXTURE PRELOADING" submenu="RENDERING" value="armsx2_texture_loading" description="Uploads entire textures at once instead of small pieces. Improves performance in most games.">
      <choice name="None" value="0" />
      <choice name="Partial" value="1" />
      <choice name="Full (Hash Cache)" value="2" />
    </feature>
    <feature name="SHOW BIOS BOOTLOGO" value="armsx2_fastboot" description="Some games have issues when the animation is shown, others require it.">
      <choice name="Skip (safer)" value="0" />
      <choice name="Show (specific games)" value="1" />
    </feature>
    <feature name="FXAA" submenu="RENDERING" value="armsx2_fxaa" description="Applies the FXAA anti-aliasing algorithm to improve the visual quality of games.">
      <choice name="Disabled" value="false" />
      <choice name="Enabled" value="true" />
    </feature>
    <feature name="CHEATS" value="armsx2_cheats" description="Automatically loads and applies cheats on game start.">
      <choice name="Disabled" value="false" />
      <choice name="Enabled" value="true" />
    </feature>
    <feature name="MULTITAP" value="armsx2_multitap" description="Allows up to 8 controllers in supported games.">
      <choice name="Maximum 2 Players (Default)" value="2" />
      <choice name="Maximum 4 Players" value="4" />
      <choice name="Maximum 8 Players" value="8" />
    </feature>
    <feature name="MULTI-THREADED VU1" submenu="SPEEDHACKS" group="ADVANCED OPTIONS" value="armsx2_vuthread" description="Runs VU1 emulation on a separate thread to improve performance on multi-core CPUs. May cause issues in some games. Default on this kit: ON (Pi 5 has 4 cores)." preset="switchauto">
    </feature>
    <feature name="EE CYCLE RATE" submenu="SPEEDHACKS" group="ADVANCED OPTIONS" value="armsx2_eecyclerate" description="Adjusts the emulated PS2 CPU speed. Lower or higher values may improve performance or game speed, but may cause issues.">
      <choice name="50%" value="-3" />
      <choice name="60%" value="-2" />
      <choice name="75%" value="-1" />
      <choice name="100%(Default)" value="0" />
      <choice name="130%" value="1" />
      <choice name="180%" value="2" />
      <choice name="300%" value="3" />
    </feature>
    <feature name="PERFORMANCE PROFILE" submenu="PERFORMANCE TOOLKIT" group="ADVANCED OPTIONS" value="armsx2_perf_profile" description="One-click speed-up for slow games. Only fills options you have not set yourself. Light: effect patches, EE 75%, async readbacks. Medium: + EE 60%, cycle skip 1, blending minimum. Max: EE 50%, cycle skip 2, no readbacks (may glitch).">
      <choice name="Off (Default)" value="off" />
      <choice name="Light" value="light" />
      <choice name="Medium" value="medium" />
      <choice name="Max" value="max" />
    </feature>
    <feature name="EFFECT REMOVAL PATCHES" submenu="PERFORMANCE TOOLKIT" group="ADVANCED OPTIONS" value="armsx2_effect_patches" description="Turns off motion blur, bloom, depth of field, fog, noise and similar effects in the about 150 game versions that have a known patch (list: system/armsx2/effect-patch-games.txt). Does nothing in other games.">
      <choice name="Off (Default)" value="0" />
      <choice name="On" value="1" />
    </feature>
    <feature name="EE CYCLE SKIP" submenu="PERFORMANCE TOOLKIT" group="ADVANCED OPTIONS" value="armsx2_eecycleskip" description="Makes the emulated PS2 CPU skip cycles. Big speed-up in CPU-heavy games; higher values can cause stutter, wrong game speed or crashes.">
      <choice name="Off (Default)" value="0" />
      <choice name="Mild (1)" value="1" />
      <choice name="Moderate (2)" value="2" />
      <choice name="Maximum (3)" value="3" />
    </feature>
    <feature name="HARDWARE READBACKS" submenu="PERFORMANCE TOOLKIT" group="ADVANCED OPTIONS" value="armsx2_readbacks" description="Copies from the GPU back to the PS2 CPU. Expensive on the Pi 5. Asynchronous is usually safe; None / Disabled are faster but can break some in-game effects.">
      <choice name="Accurate (Default)" value="0" />
      <choice name="Asynchronous" value="5" />
      <choice name="None" value="2" />
      <choice name="Disabled" value="4" />
    </feature>
    <feature name="SKIPDRAW (REMOVE EFFECTS)" submenu="PERFORMANCE TOOLKIT" group="ADVANCED OPTIONS" value="armsx2_skipdraw" description="Skips the first draw calls of effect passes. Can remove heavy shadows/bloom/fog in games without a patch. Raise step by step; too high makes parts of the world disappear.">
      <choice name="Off (Default)" value="0" />
      <choice name="1" value="1" />
      <choice name="2" value="2" />
      <choice name="3" value="3" />
      <choice name="5" value="5" />
      <choice name="10" value="10" />
      <choice name="25" value="25" />
    </feature>
    <feature name="TEXTURE REPLACEMENTS" group="ADVANCED OPTIONS" value="armsx2_texture_replacements" description="Allows user replaceable textures.">
      <choice name="Off" value="false" />
      <choice name="On" value="true" />
    </feature>
    <feature name="TIME CRISIS FOG HACK" group="ADVANCED OPTIONS" value="armsx2_crisis_fog" description="Necessary for some guns to replace fog textures as a workaround in Time Crisis - Crisis Zone.">
      <choice name="Off" value="false" />
      <choice name="On" value="true" />
    </feature>
    <feature name="WHEEL MODEL" submenu="WHEELS" group="CONTROLS" order="100" value="armsx2_wheel_type" description="Playstation 2 wheel type">
      <choice name="Driving Force" value="DrivingForce" />
      <choice name="Driving Force Pro" value="DrivingForcePro" />
      <choice name="GT Force" value="GTForce" />
      <choice name="Virtual" value="Virtual" />
    </feature>
    <feature name="SHOW LIGHT GUN CROSSHAIRS" submenu="LIGHT GUNS" group="CONTROLS" order="99" value="armsx2_crosshairs" description="">
      <choice name="Off" value="0" />
      <choice name="On" value="1" />
    </feature>
  </emulator>
</features>
